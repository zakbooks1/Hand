<!DOCTYPE html>
<html>
<head>
  <title>Shinobi Hand Seal Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <style>
    body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
    #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { position: absolute; transform: scaleX(-1); }
    video { display: none; }
    #ui { position: absolute; bottom: 20px; text-align: center; width: 100%; z-index: 10; pointer-events: none; }
    .status { font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; }
    .hint { color: #aaa; margin-top: 5px; font-size: 14px; }
    .progress { margin-top: 10px; font-size: 18px; }
    #reset-btn { 
      position: absolute; 
      top: 20px; 
      right: 20px; 
      padding: 10px 20px; 
      background: #ff4444; 
      border: none; 
      color: white; 
      cursor: pointer; 
      border-radius: 5px;
      pointer-events: auto;
      font-size: 16px;
      font-weight: bold;
      z-index: 20;
    }
    #reset-btn:hover { background: #ff6666; }
    #seal-guide { 
      position: absolute; 
      top: 20px; 
      left: 20px; 
      background: rgba(0, 0, 0, 0.8); 
      padding: 15px; 
      border-radius: 10px; 
      border: 2px solid #00d4ff;
      z-index: 20;
      pointer-events: none;
    }
    #seal-guide h3 { 
      margin: 0 0 10px 0; 
      color: #00d4ff; 
      font-size: 18px;
      text-align: center;
    }
    .seal-icon { 
      width: 80px; 
      height: 80px; 
      background: rgba(255, 255, 255, 0.1); 
      border-radius: 5px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      margin-bottom: 5px;
      border: 2px solid transparent;
      transition: all 0.3s;
    }
    .seal-icon.active { 
      border-color: #4CAF50; 
      background: rgba(76, 175, 80, 0.2);
      box-shadow: 0 0 15px #4CAF50;
    }
    .seal-icon.completed { 
      border-color: #00d4ff; 
      background: rgba(0, 212, 255, 0.2);
    }
    .seal-label { 
      font-size: 12px; 
      text-align: center; 
      color: #aaa;
      font-weight: bold;
    }
    .seal-label.active { color: #4CAF50; }
    .seal-label.completed { color: #00d4ff; }
  </style>
</head>
<body>

  <div id="container">
    <video id="input_video"></video>
    <canvas id="output_canvas"></canvas>
    <button id="reset-btn" onclick="resetSequence()">Reset</button>
    
    <div id="seal-guide">
      <h3>Hand Seals</h3>
      <div id="seal-bird">
        <div class="seal-icon active">
          <svg width="60" height="60" viewBox="0 0 60 60">
            <!-- BIRD: Thumb + Index Pointing -->
            <!-- Palm -->
            <ellipse cx="30" cy="45" rx="16" ry="10" fill="#FFE4B5" stroke="#CD853F" stroke-width="2"/>
            <!-- Thumb (extended to side) -->
            <path d="M 18 40 Q 10 38 6 32 Q 4 28 6 24 Q 10 22 14 26 L 18 35 Z" fill="#FFE4B5" stroke="#CD853F" stroke-width="2"/>
            <!-- Index finger (pointing up - tall and prominent) -->
            <rect x="26" y="10" width="8" height="30" rx="4" fill="#FFE4B5" stroke="#CD853F" stroke-width="2"/>
            <circle cx="30" cy="9" r="5" fill="#FFE4B5" stroke="#CD853F" stroke-width="2"/>
            <!-- Curled middle finger -->
            <ellipse cx="38" cy="36" rx="4" ry="7" fill="#D2B48C" stroke="#CD853F" stroke-width="1.5"/>
            <!-- Curled ring finger -->
            <ellipse cx="44" cy="39" rx="3.5" ry="6" fill="#D2B48C" stroke="#CD853F" stroke-width="1.5"/>
            <!-- Curled pinky -->
            <ellipse cx="49" cy="41" rx="3" ry="5" fill="#D2B48C" stroke="#CD853F" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="seal-label active">1. BIRD</div>
      </div>
      
      <div id="seal-snake" style="margin-top: 10px;">
        <div class="seal-icon">
          <svg width="60" height="60" viewBox="0 0 60 60">
            <!-- SNAKE: Open Palm - All Fingers Extended -->
            <!-- Palm base -->
            <ellipse cx="30" cy="48" rx="18" ry="9" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
            <!-- Thumb -->
            <path d="M 14 42 L 8 38 Q 4 34 5 28 Q 6 24 10 23 Q 13 23 14 28 L 15 38 Z" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
            <!-- Index finger -->
            <rect x="20" y="8" width="7" height="36" rx="3.5" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
            <circle cx="23.5" cy="7" r="4" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
            <!-- Middle finger (tallest) -->
            <rect x="29" y="4" width="7" height="40" rx="3.5" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
            <circle cx="32.5" cy="3" r="4" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
            <!-- Ring finger -->
            <rect x="38" y="7" width="7" height="37" rx="3.5" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
            <circle cx="41.5" cy="6" r="4" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
            <!-- Pinky -->
            <rect x="47" y="12" width="6" height="32" rx="3" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
            <circle cx="50" cy="11" r="3.5" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
          </svg>
        </div>
        <div class="seal-label">2. SNAKE</div>
      </div>
      
      <div id="seal-tiger" style="margin-top: 10px;">
        <div class="seal-icon">
          <svg width="60" height="60" viewBox="0 0 60 60">
            <!-- TIGER: Peace Sign - Index + Middle Up -->
            <!-- Palm -->
            <ellipse cx="30" cy="46" rx="16" ry="10" fill="#FFB6C1" stroke="#C71585" stroke-width="2"/>
            <!-- Index finger (extended) -->
            <rect x="22" y="10" width="7" height="32" rx="3.5" fill="#FFB6C1" stroke="#C71585" stroke-width="2"/>
            <circle cx="25.5" cy="9" r="4" fill="#FFB6C1" stroke="#C71585" stroke-width="2"/>
            <!-- Middle finger (extended) -->
            <rect x="31" y="8" width="7" height="34" rx="3.5" fill="#FFB6C1" stroke="#C71585" stroke-width="2"/>
            <circle cx="34.5" cy="7" r="4" fill="#FFB6C1" stroke="#C71585" stroke-width="2"/>
            <!-- Curled ring finger -->
            <ellipse cx="42" cy="38" rx="4" ry="8" fill="#DB7093" stroke="#C71585" stroke-width="1.5"/>
            <!-- Curled pinky -->
            <ellipse cx="48" cy="40" rx="3.5" ry="7" fill="#DB7093" stroke="#C71585" stroke-width="1.5"/>
            <!-- Thumb (tucked) -->
            <ellipse cx="18" cy="42" rx="5" ry="6" fill="#DB7093" stroke="#C71585" stroke-width="1.5" transform="rotate(-20 18 42)"/>
          </svg>
        </div>
        <div class="seal-label">3. TIGER</div>
      </div>
    </div>
    
    <div id="ui">
      <div id="status-text" class="status">Perform: Bird → Snake → Tiger</div>
      <div class="progress" id="progress-text">Progress: 0/3</div>
      <div class="hint">Show your hands to the camera | Hold each seal for 1 second</div>
    </div>
  </div>

<script>
const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const statusText = document.getElementById('status-text');
const progressText = document.getElementById('progress-text');

let currentStep = 0;
const sequence = ['BIRD', 'SNAKE', 'TIGER'];
let powerActive = false;
let lastGesture = null;
let gestureHoldTime = 0;
const HOLD_DURATION = 30; // ~1 second at 30fps
let gestureFrameCount = 0;

function resetSequence() {
  currentStep = 0;
  powerActive = false;
  lastGesture = null;
  gestureHoldTime = 0;
  gestureFrameCount = 0;
  statusText.innerText = "Perform: Bird → Snake → Tiger";
  statusText.style.color = "white";
  progressText.innerText = "Progress: 0/3";
  updateSealGuide();
}

function updateSealGuide() {
  const seals = ['bird', 'snake', 'tiger'];
  
  seals.forEach((seal, index) => {
    const icon = document.querySelector(`#seal-${seal} .seal-icon`);
    const label = document.querySelector(`#seal-${seal} .seal-label`);
    
    // Remove all classes
    icon.classList.remove('active', 'completed');
    label.classList.remove('active', 'completed');
    
    if (index < currentStep) {
      // Completed seals
      icon.classList.add('completed');
      label.classList.add('completed');
    } else if (index === currentStep && !powerActive) {
      // Current seal
      icon.classList.add('active');
      label.classList.add('active');
    }
  });
}

function onResults(results) {
  canvasElement.width = window.innerWidth;
  canvasElement.height = window.innerHeight;
  canvasCtx.save();
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
  
  // Draw the video feed (mirrored for natural interaction)
  canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    let detectedGesture = null;
    
    // Draw all hands
    for (const landmarks of results.multiHandLandmarks) {
      drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
      drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 3});

      // Detect gesture from any hand
      const gesture = detectGesture(landmarks);
      if (gesture) {
        detectedGesture = gesture;
      }

      // Draw power effect on all hands if active
      if (powerActive) {
        drawPowerEffect(landmarks[0]);
      }
    }
    
    // Sequence progression logic (only if not already completed)
    if (!powerActive && detectedGesture === sequence[currentStep]) {
      if (lastGesture === detectedGesture) {
        gestureHoldTime++;
        
        // Visual feedback: show hold progress
        const holdPercent = Math.min(100, (gestureHoldTime / HOLD_DURATION) * 100);
        statusText.innerText = `Hold ${detectedGesture}... ${holdPercent.toFixed(0)}%`;
        
        if (gestureHoldTime >= HOLD_DURATION) {
          currentStep++;
          gestureHoldTime = 0;
          
          if (currentStep >= sequence.length) {
            powerActive = true;
            statusText.innerText = "⚡ CHIDORI ACTIVATED! ⚡";
            statusText.style.color = "#00d4ff";
            progressText.innerText = "Progress: 3/3 - COMPLETE!";
            updateSealGuide();
          } else {
            statusText.innerText = `Next: ${sequence[currentStep]}`;
            statusText.style.color = "#4CAF50";
            progressText.innerText = `Progress: ${currentStep}/3`;
            updateSealGuide();
            setTimeout(() => {
              statusText.style.color = "white";
            }, 1000);
          }
        }
      } else {
        gestureHoldTime = 0;
      }
      lastGesture = detectedGesture;
    } else if (detectedGesture !== sequence[currentStep]) {
      // Reset hold time if wrong gesture or hand moved
      if (gestureHoldTime > 0) {
        gestureHoldTime = 0;
        if (!powerActive) {
          statusText.innerText = `Perform: ${sequence[currentStep]}`;
          statusText.style.color = "white";
        }
      }
      lastGesture = detectedGesture;
    }
  } else {
    // No hands detected - reset hold timer
    gestureHoldTime = 0;
    lastGesture = null;
  }
  
  canvasCtx.restore();
}

function detectGesture(lm) {
  // Calculate if fingers are extended (comparing tip to base)
  const thumbExtended = lm[4].x < lm[3].x - 0.02; // Thumb points left when extended
  const indexExtended = lm[8].y < lm[6].y;
  const middleExtended = lm[12].y < lm[10].y;
  const ringExtended = lm[16].y < lm[14].y;
  const pinkyExtended = lm[20].y < lm[18].y;
  
  // Count extended fingers
  const extendedCount = [indexExtended, middleExtended, ringExtended, pinkyExtended].filter(Boolean).length;
  
  // BIRD: Thumb and index extended, others closed (like pointing)
  // More lenient: thumb extended and index extended
  if (thumbExtended && indexExtended && !middleExtended && !ringExtended) {
    return 'BIRD';
  }
  
  // SNAKE: All fingers extended (open palm)
  if (indexExtended && middleExtended && ringExtended && pinkyExtended) {
    return 'SNAKE';
  }
  
  // TIGER: Index and middle extended, others closed (peace sign / tiger seal)
  if (indexExtended && middleExtended && !ringExtended && !pinkyExtended) {
    return 'TIGER';
  }
  
  return null;
}

function drawPowerEffect(base) {
  const x = base.x * canvasElement.width;
  const y = base.y * canvasElement.height;
  
  // Animated pulsing effect
  const time = Date.now() / 100;
  const pulse = Math.sin(time) * 10 + 70;
  
  // Create a glowing lightning orb
  canvasCtx.beginPath();
  let gradient = canvasCtx.createRadialGradient(x, y, 10, x, y, pulse);
  gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
  gradient.addColorStop(0.2, 'rgba(0, 212, 255, 0.6)');
  gradient.addColorStop(0.6, 'rgba(0, 150, 255, 0.3)');
  gradient.addColorStop(1, 'transparent');
  
  canvasCtx.fillStyle = gradient;
  canvasCtx.arc(x, y, pulse + 20, 0, 2 * Math.PI);
  canvasCtx.fill();
  
  // Random lightning bolts
  canvasCtx.strokeStyle = `rgba(255, 255, 255, ${0.7 + Math.random() * 0.3})`;
  canvasCtx.lineWidth = 3;
  canvasCtx.shadowBlur = 10;
  canvasCtx.shadowColor = '#00d4ff';
  
  for(let i = 0; i < 8; i++) {
    const angle = (Math.PI * 2 * i) / 8 + time * 0.5;
    const length = 60 + Math.random() * 40;
    const endX = x + Math.cos(angle) * length;
    const endY = y + Math.sin(angle) * length;
    
    canvasCtx.beginPath();
    canvasCtx.moveTo(x, y);
    
    // Add jagged lightning effect
    const midX = (x + endX) / 2 + (Math.random() - 0.5) * 30;
    const midY = (y + endY) / 2 + (Math.random() - 0.5) * 30;
    canvasCtx.lineTo(midX, midY);
    canvasCtx.lineTo(endX, endY);
    canvasCtx.stroke();
  }
  
  canvasCtx.shadowBlur = 0;
}

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});
hands.onResults(onResults);

const camera = new Camera(videoElement, {
  onFrame: async () => {
    await hands.send({image: videoElement});
  },
  width: 1280,
  height: 720
});
camera.start();

// Initialize seal guide
updateSealGuide();
</script>
</body>
</html>
