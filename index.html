<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shinobi Hand Seal Tracker - 3D Edition</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js"></script>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script>

  <style>
    body { margin: 0; background: #0a0a1f; color: white; font-family: sans-serif; overflow: hidden; }
    #container { position: relative; width: 100vw; height: 100vh; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #output_canvas { transform: scaleX(-1); z-index: 1; }
    #three-canvas { pointer-events: none; z-index: 2; }
    video { display: none; }
    #ui { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; z-index: 10; pointer-events: none; }
    .status { font-size: 32px; font-weight: bold; text-shadow: 3px 3px 6px #000; }
    .hint { color: #ccc; margin-top: 8px; font-size: 16px; }
    .progress { margin-top: 12px; font-size: 20px; }
    #reset-btn {
      position: absolute; top: 20px; right: 20px; z-index: 20; pointer-events: auto;
      padding: 12px 24px; background: #c62828; border: none; color: white;
      font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer;
    }
    #reset-btn:hover { background: #e53935; }
    #jutsu-selector {
      position: absolute; top: 20px; right: 180px; z-index: 20; pointer-events: auto;
    }
    #jutsu-select {
      padding: 12px 20px; background: #222; color: white; border: 2px solid #00d4ff;
      border-radius: 8px; font-size: 16px; cursor: pointer;
    }
    #seal-guide {
      position: absolute; top: 20px; left: 20px; z-index: 20; pointer-events: none;
      background: rgba(0,0,0,0.75); padding: 20px; border-radius: 12px;
      border: 2px solid #00d4ff; max-height: 80vh; overflow-y: auto; min-width: 180px;
    }
    #seal-guide h3 { margin: 0 0 12px; color: #00d4ff; text-align: center; font-size: 20px; }
    .jutsu-name { color: #ffeb3b; font-size: 16px; text-align: center; margin-bottom: 12px; font-weight: bold; }
    .seal-icon { width: 80px; height: 80px; margin: 0 auto 6px; background: rgba(255,255,255,0.08);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      border: 2px solid transparent; transition: all 0.3s;
    }
    .seal-icon.active { border-color: #4caf50; background: rgba(76,175,80,0.25); box-shadow: 0 0 20px #4caf50; }
    .seal-icon.completed { border-color: #00d4ff; background: rgba(0,212,255,0.2); }
    .seal-label { font-size: 13px; text-align: center; color: #bbb; font-weight: bold; }
    .seal-label.active { color: #4caf50; }
    .seal-label.completed { color: #00d4ff; }
  </style>
</head>
<body>

<div id="container">
  <video id="input_video"></video>
  <canvas id="output_canvas"></canvas>
  <canvas id="three-canvas"></canvas>

  <div id="jutsu-selector">
    <select id="jutsu-select" onchange="changeJutsu()">
      <option value="chidori">⚡ Chidori</option>
      <option value="rasengan">🌀 Rasengan</option>
      <option value="fireball">🔥 Fireball Jutsu</option>
      <option value="earthwall" selected>🪨 Earth Wall</option>
      <option value="shadowclone">👥 Shadow Clone</option>
      <option value="sharingan">👁️ Sharingan</option>
      <option value="byakugan">👀 Byakugan</option>
      <option value="waterdragon">🌊 Water Dragon</option>
      <option value="substitution">🪵 Substitution</option>
      <option value="transformation">✨ Transformation</option>
      <option value="summoning">📜 Summoning</option>
    </select>
  </div>

  <button id="reset-btn" onclick="resetSequence()">Reset</button>

  <div id="seal-guide">
    <h3>Hand Seals</h3>
    <div class="jutsu-name" id="jutsu-name">Earth Wall</div>
    <div id="seals-container"></div>
  </div>

  <div id="ui">
    <div id="status-text" class="status">Loading camera...</div>
    <div class="progress" id="progress-text">Progress: 0/0</div>
    <div class="hint">Show both hands to the camera • Hold each seal ~1 second</div>
  </div>
</div>

<script>
// ──────────────────────────────────────────────
// Core variables
// ──────────────────────────────────────────────
const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const statusText = document.getElementById('status-text');
const progressText = document.getElementById('progress-text');
const sealsContainer = document.getElementById('seals-container');
const jutsuNameEl = document.getElementById('jutsu-name');

let currentJutsu = 'earthwall';
let currentStep = 0;
let sequence = [];
let powerActive = false;
let lastGesture = null;
let gestureHoldTime = 0;
const HOLD_DURATION = 25; // ≈0.8–1s at 30–60fps

// ──────────────────────────────────────────────
// Jutsu definitions (easy 3–5 seal sequences)
// ──────────────────────────────────────────────
const jutsuList = {
  earthwall: { name: "Earth Style: Earth Wall", seals: ['FIST','PALM','FIST'], color: '#8B4513', message: '🪨 EARTH WALL RAISED! 🪨' },
  chidori:   { name: "Chidori", seals: ['FIST','PALM','PEACE'], color: '#00d4ff', message: '⚡ CHIDORI ACTIVATED! ⚡' },
  rasengan:  { name: "Rasengan", seals: ['PALM','FIST','PALM'], color: '#4169E1', message: '🌀 RASENGAN FORMED! 🌀' },
  fireball:  { name: "Fireball Jutsu", seals: ['PALM','FIST','PEACE','PALM'], color: '#FF4500', message: '🔥 FIREBALL JUTSU! 🔥' },
  shadowclone: { name: "Shadow Clone Jutsu", seals: ['PEACE','FIST','PEACE'], color: '#9370DB', message: '👥 CLONES CREATED! 👥' },
  // add more as needed...
};

// ──────────────────────────────────────────────
// Seal SVG icons
// ──────────────────────────────────────────────
const sealIcons = {
  FIST: `<svg width="70" height="70" viewBox="0 0 60 60"><ellipse cx="30" cy="35" rx="18" ry="20" fill="#CD853F" stroke="#8B4513" stroke-width="3"/><text x="30" y="50" text-anchor="middle" fill="#FFF" font-size="28">✊</text></svg>`,
  PALM: `<svg width="70" height="70" viewBox="0 0 60 60"><rect x="18" y="8" width="24" height="36" rx="6" fill="#FFE4B5" stroke="#CD853F" stroke-width="3"/><text x="30" y="55" text-anchor="middle" fill="#8B4513" font-size="28">🖐️</text></svg>`,
  PEACE: `<svg width="70" height="70" viewBox="0 0 60 60"><rect x="20" y="10" width="20" height="34" rx="6" fill="#FFB6C1" stroke="#C71585" stroke-width="3"/><text x="30" y="55" text-anchor="middle" fill="#C71585" font-size="28">✌️</text></svg>`,
  POINT: `<svg width="70" height="70" viewBox="0 0 60 60"><rect x="24" y="10" width="12" height="34" rx="6" fill="#98D8C8" stroke="#2F847C" stroke-width="3"/><circle cx="30" cy="12" r="8" fill="#98D8C8" stroke="#2F847C" stroke-width="3"/><text x="30" y="55" text-anchor="middle" fill="#2F847C" font-size="28">☝️</text></svg>`
};

// ──────────────────────────────────────────────
// Three.js 3D setup
// ──────────────────────────────────────────────
const threeCanvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const threeCamera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
threeCamera.position.set(0, 0, 8);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

let earthWall = null;

function createEarthWall(wristX, wristY, wristZ) {
  if (earthWall) scene.remove(earthWall);

  const geometry = new THREE.BoxGeometry(5, 4, 0.6);
  const material = new THREE.MeshStandardMaterial({
    color: 0x8B4513,
    roughness: 0.95,
    metalness: 0.05
  });
  earthWall = new THREE.Mesh(geometry, material);

  // Position roughly in front of hand (normalized coords → world space)
  earthWall.position.set(
    (wristX - 0.5) * 12,
    (0.5 - wristY) * 12,
    -3 + wristZ * -15   // closer if hand is closer to camera
  );

  earthWall.rotation.y = Math.random() * 0.4 - 0.2; // slight tilt
  earthWall.scale.set(0.1, 0.1, 0.1);

  scene.add(earthWall);

  // Grow animation
  let s = 0.1;
  const grow = setInterval(() => {
    s += 0.04;
    earthWall.scale.set(s, s, s);
    if (s >= 1) clearInterval(grow);
  }, 40);
}

function animateThree() {
  requestAnimationFrame(animateThree);
  if (earthWall) {
    earthWall.rotation.y += 0.002;
  }
  renderer.render(scene, threeCamera);
}
animateThree();

window.addEventListener('resize', () => {
  threeCamera.aspect = window.innerWidth / window.innerHeight;
  threeCamera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ──────────────────────────────────────────────
// Gesture logic & main loop
// ──────────────────────────────────────────────
function changeJutsu() {
  currentJutsu = document.getElementById('jutsu-select').value;
  resetSequence();
}

function resetSequence() {
  currentStep = 0;
  powerActive = false;
  lastGesture = null;
  gestureHoldTime = 0;
  if (earthWall) { scene.remove(earthWall); earthWall = null; }

  const j = jutsuList[currentJutsu];
  sequence = j.seals;
  jutsuNameEl.innerText = j.name;
  statusText.innerText = `Perform: ${sequence.join(' → ')}`;
  statusText.style.color = "white";
  progressText.innerText = `Progress: 0/${sequence.length}`;
  renderSeals();
  updateSealGuide();
}

function renderSeals() {
  sealsContainer.innerHTML = '';
  sequence.forEach((seal, i) => {
    const div = document.createElement('div');
    div.innerHTML = `
      <div class="seal-icon">${sealIcons[seal]}</div>
      <div class="seal-label">${i+1}. ${seal}</div>
    `;
    sealsContainer.appendChild(div);
  });
}

function updateSealGuide() {
  document.querySelectorAll('#seals-container > div').forEach((el, i) => {
    const icon = el.querySelector('.seal-icon');
    const label = el.querySelector('.seal-label');
    icon.classList.remove('active','completed');
    label.classList.remove('active','completed');
    if (i < currentStep) {
      icon.classList.add('completed');
      label.classList.add('completed');
    } else if (i === currentStep && !powerActive) {
      icon.classList.add('active');
      label.classList.add('active');
    }
  });
}

function detectGesture(lm) {
  const thumb = lm[4].x < lm[3].x - 0.02;
  const idx   = lm[8].y < lm[6].y + 0.015;
  const mid   = lm[12].y < lm[10].y + 0.015;
  const ring  = lm[16].y < lm[14].y + 0.015;
  const pinky = lm[20].y < lm[18].y + 0.015;

  const ext = [idx, mid, ring, pinky].filter(Boolean).length;

  if (ext <= 1 && !idx) return 'FIST';
  if (ext >= 3) return 'PALM';
  if (idx && mid && ext === 2) return 'PEACE';
  if (idx && !mid && ext === 1) return 'POINT';
  return null;
}

function onResults(results) {
  canvasElement.width = window.innerWidth;
  canvasElement.height = window.innerHeight;
  canvasCtx.save();
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
  canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

  let detected = null;
  let wristPos = null;

  if (results.multiHandLandmarks) {
    for (const lm of results.multiHandLandmarks) {
      drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, {color: '#00ff88', lineWidth: 3});
      drawLandmarks(canvasCtx, lm, {color: '#ff3366', lineWidth: 1.5, radius: 4});

      const g = detectGesture(lm);
      if (g) detected = g;

      // Use leftmost wrist for positioning (arbitrary choice)
      if (!wristPos || lm[0].x < wristPos.x) {
        wristPos = lm[0];
      }
    }
  }

  if (!powerActive && detected === sequence[currentStep]) {
    if (lastGesture === detected) {
      gestureHoldTime++;
      const pct = Math.min(100, (gestureHoldTime / HOLD_DURATION) * 100);
      statusText.innerText = `Hold ${detected}... ${pct.toFixed(0)}%`;

      if (gestureHoldTime >= HOLD_DURATION) {
        currentStep++;
        gestureHoldTime = 0;

        if (currentStep >= sequence.length) {
          powerActive = true;
          const j = jutsuList[currentJutsu];
          statusText.innerText = j.message;
          statusText.style.color = j.color;
          progressText.innerText = `COMPLETE!`;

          // 3D Earth Wall spawn
          if (currentJutsu === 'earthwall' && wristPos) {
            createEarthWall(wristPos.x, wristPos.y, wristPos.z);
          }
          // You can add more 3D effects for other jutsus here
        } else {
          statusText.innerText = `Next: ${sequence[currentStep]}`;
          statusText.style.color = "#4caf50";
          progressText.innerText = `Progress: ${currentStep}/${sequence.length}`;
          setTimeout(() => { if (!powerActive) statusText.style.color = "white"; }, 1200);
        }
        updateSealGuide();
      }
    } else {
      gestureHoldTime = 0;
    }
    lastGesture = detected;
  } else if (detected !== sequence[currentStep]) {
    if (gestureHoldTime > 0) {
      gestureHoldTime = 0;
      if (!powerActive) {
        statusText.innerText = `Perform: ${sequence[currentStep]}`;
        statusText.style.color = "white";
      }
    }
    lastGesture = detected;
  }

  canvasCtx.restore();
}

// ──────────────────────────────────────────────
// Initialize MediaPipe Hands
// ──────────────────────────────────────────────
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.45,
  minTrackingConfidence: 0.45
});

hands.onResults(onResults);

const camera = new Camera(videoElement, {
  onFrame: async () => {
    await hands.send({image: videoElement});
  },
  width: 1280,
  height: 720
});

camera.start().then(() => {
  statusText.innerText = "Camera ready • Make seals!";
  resetSequence();
}).catch(err => {
  statusText.innerText = "Camera error: " + err.message;
  statusText.style.color = "#ff5252";
});
</script>
</body>
</html>
