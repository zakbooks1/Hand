<!DOCTYPE html>
<html>
<head>
  <title>Shinobi Hand Seal Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <style>
    body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
    #container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { position: absolute; transform: scaleX(-1); }
    video { display: none; }
    #ui { position: absolute; bottom: 20px; text-align: center; width: 100%; z-index: 10; pointer-events: none; }
    .status { font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; }
    .hint { color: #aaa; margin-top: 5px; font-size: 14px; }
    .progress { margin-top: 10px; font-size: 18px; }
    #reset-btn { 
      position: absolute; 
      top: 20px; 
      right: 20px; 
      padding: 10px 20px; 
      background: #ff4444; 
      border: none; 
      color: white; 
      cursor: pointer; 
      border-radius: 5px;
      pointer-events: auto;
      font-size: 16px;
      font-weight: bold;
      z-index: 20;
    }
    #reset-btn:hover { background: #ff6666; }
    #jutsu-selector {
      position: absolute;
      top: 20px;
      right: 140px;
      z-index: 20;
      pointer-events: auto;
    }
    #jutsu-selector select {
      padding: 10px 15px;
      background: #333;
      color: white;
      border: 2px solid #00d4ff;
      border-radius: 5px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    #jutsu-selector select:hover {
      background: #444;
    }
    #seal-guide { 
      position: absolute; 
      top: 20px; 
      left: 20px; 
      background: rgba(0, 0, 0, 0.8); 
      padding: 15px; 
      border-radius: 10px; 
      border: 2px solid #00d4ff;
      z-index: 20;
      pointer-events: none;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }
    #seal-guide h3 { 
      margin: 0 0 10px 0; 
      color: #00d4ff; 
      font-size: 18px;
      text-align: center;
    }
    .jutsu-name {
      color: #ffd700;
      font-size: 14px;
      text-align: center;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .seal-icon { 
      width: 70px; 
      height: 70px; 
      background: rgba(255, 255, 255, 0.1); 
      border-radius: 5px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      margin-bottom: 5px;
      border: 2px solid transparent;
      transition: all 0.3s;
    }
    .seal-icon.active { 
      border-color: #4CAF50; 
      background: rgba(76, 175, 80, 0.2);
      box-shadow: 0 0 15px #4CAF50;
    }
    .seal-icon.completed { 
      border-color: #00d4ff; 
      background: rgba(0, 212, 255, 0.2);
    }
    .seal-label { 
      font-size: 11px; 
      text-align: center; 
      color: #aaa;
      font-weight: bold;
    }
    .seal-label.active { color: #4CAF50; }
    .seal-label.completed { color: #00d4ff; }
  </style>
</head>
<body>

  <div id="container">
    <video id="input_video"></video>
    <canvas id="output_canvas"></canvas>
    
    <div id="jutsu-selector">
      <select id="jutsu-select" onchange="changeJutsu()">
        <option value="chidori">⚡ Chidori</option>
        <option value="rasengan">🌀 Rasengan</option>
        <option value="fireball">🔥 Fireball Jutsu</option>
        <option value="shadowclone">👥 Shadow Clone</option>
        <option value="sharingan">👁️ Sharingan</option>
        <option value="byakugan">👀 Byakugan</option>
        <option value="waterdragon">🌊 Water Dragon</option>
        <option value="substitution">🪵 Substitution</option>
        <option value="transformation">✨ Transformation</option>
        <option value="summoning">📜 Summoning Jutsu</option>
        <option value="earthwall">🪨 Earth Wall</option>
        <option value="windscythe">💨 Wind Scythe</option>
        <option value="lightningblade">⚡ Lightning Blade</option>
        <option value="icemirrors">❄️ Ice Mirrors</option>
        <option value="sandcoffin">🏜️ Sand Coffin</option>
        <option value="eightgates">💪 Eight Gates</option>
        <option value="particlestyle">✨ Particle Style</option>
        <option value="woodstyle">🌳 Wood Style</option>
      </select>
    </div>
    
    <button id="reset-btn" onclick="resetSequence()">Reset</button>
    
    <div id="seal-guide">
      <h3>Hand Seals</h3>
      <div class="jutsu-name" id="jutsu-name">Chidori</div>
      <div id="seals-container"></div>
    </div>
    
    <div id="ui">
      <div id="status-text" class="status">Loading...</div>
      <div class="progress" id="progress-text">Progress: 0/0</div>
      <div class="hint">Show your hands to the camera | Hold each seal for 1 second</div>
    </div>
  </div>

<script>
const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const statusText = document.getElementById('status-text');
const progressText = document.getElementById('progress-text');
const sealsContainer = document.getElementById('seals-container');
const jutsuNameEl = document.getElementById('jutsu-name');

// Jutsu configurations - ALL WITH EASIER SEALS
const jutsuList = {

  },

  },

  },

  },

    seals: ['PALM', 'PEACE', 'PALM'],
    color: '#87CEEB',
    message: '💨 WIND SCYTHE! 💨'
  },
  lightningblade: {
    name: "Lightning Blade",
    seals: ['PEACE', 'FIST', 'POINT'],
    color: '#FFFF00',
    message: '⚡ LIGHTNING BLADE! ⚡'
  },
  icemirrors: {
    name: "Ice Style: Crystal Ice Mirrors",
    seals: ['PALM', 'POINT', 'PEACE', 'PALM'],
    color: '#B0E0E6',
    message: '❄️ ICE MIRRORS! ❄️'
  },
  sandcoffin: {
    name: "Sand Coffin",
    seals: ['FIST', 'FIST', 'PALM'],
    color: '#DEB887',
    message: '🏜️ SAND COFFIN! 🏜️'
  },
  eightgates: {
    name: "Eight Gates Release",
    seals: ['FIST', 'PEACE', 'FIST', 'PEACE'],
    color: '#FF0000',
    message: '💪 EIGHT GATES OPEN! 💪'
  },
  particlestyle: {
    name: "Particle Style",
    seals: ['PALM', 'PEACE', 'PALM', 'FIST'],
    color: '#FFFFFF',
    message: '✨ PARTICLE STYLE! ✨'
  },
  woodstyle: {
    name: "Wood Style: Deep Forest",
    seals: ['FIST', 'PALM', 'PEACE', 'PALM'],
    color: '#228B22',
    message: '🌳 WOOD STYLE! 🌳'
  }
};

let currentJutsu = 'chidori';
let currentStep = 0;
let sequence = [];
let powerActive = false;
let lastGesture = null;
let gestureHoldTime = 0;
const HOLD_DURATION = 30;

// Seal SVG icons - SIMPLIFIED TO 4 EASY GESTURES
const sealIcons = {
  FIST: `<svg width="60" height="60" viewBox="0 0 60 60">
    <ellipse cx="30" cy="35" rx="18" ry="20" fill="#CD853F" stroke="#8B4513" stroke-width="3"/>
    <ellipse cx="20" cy="28" rx="5" ry="8" fill="#A0522D" stroke="#8B4513" stroke-width="2"/>
    <ellipse cx="30" cy="26" rx="5" ry="8" fill="#A0522D" stroke="#8B4513" stroke-width="2"/>
    <ellipse cx="40" cy="28" rx="5" ry="8" fill="#A0522D" stroke="#8B4513" stroke-width="2"/>
    <text x="30" y="50" text-anchor="middle" fill="#FFF" font-size="12" font-weight="bold">✊</text>
  </svg>`,
  
  PALM: `<svg width="60" height="60" viewBox="0 0 60 60">
    <ellipse cx="30" cy="48" rx="18" ry="9" fill="#FFE4B5" stroke="#CD853F" stroke-width="2"/>
    <rect x="18" y="8" width="6" height="36" rx="3" fill="#FFE4B5" stroke="#CD853F" stroke-width="2"/>
    <rect x="26" y="5" width="6" height="39" rx="3" fill="#FFE4B5" stroke="#CD853F" stroke-width="2"/>
    <rect x="34" y="6" width="6" height="38" rx="3" fill="#FFE4B5" stroke="#CD853F" stroke-width="2"/>
    <rect x="42" y="10" width="6" height="34" rx="3" fill="#FFE4B5" stroke="#CD853F" stroke-width="2"/>
    <text x="30" y="58" text-anchor="middle" fill="#8B4513" font-size="12" font-weight="bold">🖐️</text>
  </svg>`,
  
  PEACE: `<svg width="60" height="60" viewBox="0 0 60 60">
    <ellipse cx="30" cy="46" rx="16" ry="10" fill="#FFB6C1" stroke="#C71585" stroke-width="2"/>
    <rect x="22" y="10" width="7" height="32" rx="3.5" fill="#FFB6C1" stroke="#C71585" stroke-width="2"/>
    <rect x="31" y="8" width="7" height="34" rx="3.5" fill="#FFB6C1" stroke="#C71585" stroke-width="2"/>
    <ellipse cx="42" cy="38" rx="4" ry="8" fill="#DB7093" stroke="#C71585" stroke-width="1.5"/>
    <ellipse cx="18" cy="42" rx="5" ry="6" fill="#DB7093" stroke="#C71585" stroke-width="1.5"/>
    <text x="30" y="58" text-anchor="middle" fill="#C71585" font-size="12" font-weight="bold">✌️</text>
  </svg>`,
  
  POINT: `<svg width="60" height="60" viewBox="0 0 60 60">
    <ellipse cx="30" cy="45" rx="16" ry="10" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
    <rect x="26" y="10" width="8" height="30" rx="4" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
    <circle cx="30" cy="9" r="5" fill="#98D8C8" stroke="#2F847C" stroke-width="2"/>
    <ellipse cx="38" cy="36" rx="4" ry="7" fill="#5F9EA0" stroke="#2F847C" stroke-width="1.5"/>
    <ellipse cx="44" cy="39" rx="3.5" ry="6" fill="#5F9EA0" stroke="#2F847C" stroke-width="1.5"/>
    <ellipse cx="18" cy="40" rx="5" ry="6" fill="#5F9EA0" stroke="#2F847C" stroke-width="1.5"/>
    <text x="30" y="58" text-anchor="middle" fill="#2F847C" font-size="12" font-weight="bold">☝️</text>
  </svg>`
};

function changeJutsu() {
  const select = document.getElementById('jutsu-select');
  currentJutsu = select.value;
  resetSequence();
}

function resetSequence() {
  currentStep = 0;
  powerActive = false;
  lastGesture = null;
  gestureHoldTime = 0;
  
  const jutsu = jutsuList[currentJutsu];
  sequence = jutsu.seals;
  
  jutsuNameEl.innerText = jutsu.name;
  statusText.innerText = `Perform: ${sequence.join(' → ')}`;
  statusText.style.color = "white";
  progressText.innerText = `Progress: 0/${sequence.length}`;
  
  renderSeals();
  updateSealGuide();
}

function renderSeals() {
  sealsContainer.innerHTML = '';
  const jutsu = jutsuList[currentJutsu];
  
  jutsu.seals.forEach((seal, index) => {
    const sealDiv = document.createElement('div');
    sealDiv.id = `seal-${index}`;
    sealDiv.style.marginTop = index > 0 ? '10px' : '0';
    
    sealDiv.innerHTML = `
      <div class="seal-icon">${sealIcons[seal]}</div>
      <div class="seal-label">${index + 1}. ${seal}</div>
    `;
    
    sealsContainer.appendChild(sealDiv);
  });
}

function updateSealGuide() {
  sequence.forEach((seal, index) => {
    const icon = document.querySelector(`#seal-${index} .seal-icon`);
    const label = document.querySelector(`#seal-${index} .seal-label`);
    
    icon.classList.remove('active', 'completed');
    label.classList.remove('active', 'completed');
    
    if (index < currentStep) {
      icon.classList.add('completed');
      label.classList.add('completed');
    } else if (index === currentStep && !powerActive) {
      icon.classList.add('active');
      label.classList.add('active');
    }
  });
}

function onResults(results) {
  canvasElement.width = window.innerWidth;
  canvasElement.height = window.innerHeight;
  canvasCtx.save();
  canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
  
  canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    let detectedGesture = null;
    
    for (const landmarks of results.multiHandLandmarks) {
      drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
      drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', lineWidth: 1, radius: 3});

      const gesture = detectGesture(landmarks);
      if (gesture) {
        detectedGesture = gesture;
      }

      if (powerActive) {
        drawPowerEffect(landmarks);
      }
    }
    
    if (!powerActive && detectedGesture === sequence[currentStep]) {
      if (lastGesture === detectedGesture) {
        gestureHoldTime++;
        
        const holdPercent = Math.min(100, (gestureHoldTime / HOLD_DURATION) * 100);
        statusText.innerText = `Hold ${detectedGesture}... ${holdPercent.toFixed(0)}%`;
        
        if (gestureHoldTime >= HOLD_DURATION) {
          currentStep++;
          gestureHoldTime = 0;
          
          if (currentStep >= sequence.length) {
            powerActive = true;
            const jutsu = jutsuList[currentJutsu];
            statusText.innerText = jutsu.message;
            statusText.style.color = jutsu.color;
            progressText.innerText = `Progress: ${sequence.length}/${sequence.length} - COMPLETE!`;
            updateSealGuide();
          } else {
            statusText.innerText = `Next: ${sequence[currentStep]}`;
            statusText.style.color = "#4CAF50";
            progressText.innerText = `Progress: ${currentStep}/${sequence.length}`;
            updateSealGuide();
            setTimeout(() => {
              statusText.style.color = "white";
            }, 1000);
          }
        }
      } else {
        gestureHoldTime = 0;
      }
      lastGesture = detectedGesture;
    } else if (detectedGesture !== sequence[currentStep]) {
      if (gestureHoldTime > 0) {
        gestureHoldTime = 0;
        if (!powerActive) {
          statusText.innerText = `Perform: ${sequence[currentStep]}`;
          statusText.style.color = "white";
        }
      }
      lastGesture = detectedGesture;
    }
  } else {
    gestureHoldTime = 0;
    lastGesture = null;
  }
  
  canvasCtx.restore();
}

function detectGesture(lm) {
  // More lenient detection with lower thresholds
  const thumbExtended = lm[4].x < lm[3].x - 0.015; // More lenient
  const indexExtended = lm[8].y < lm[6].y + 0.01; // More lenient
  const middleExtended = lm[12].y < lm[10].y + 0.01;
  const ringExtended = lm[16].y < lm[14].y + 0.01;
  const pinkyExtended = lm[20].y < lm[18].y + 0.01;
  
  const extendedCount = [indexExtended, middleExtended, ringExtended, pinkyExtended].filter(Boolean).length;
  
  // FIST: All fingers curled (0-1 extended)
  if (extendedCount <= 1 && !indexExtended) {
    return 'FIST';
  }
  
  // PALM: All fingers extended (3-4 extended is good enough)
  if (extendedCount >= 3) {
    return 'PALM';
  }
  
  // PEACE: Index and middle extended (most lenient)
  if (indexExtended && middleExtended && extendedCount === 2) {
    return 'PEACE';
  }
  
  // POINT: Only index extended
  if (indexExtended && !middleExtended && extendedCount === 1) {
    return 'POINT';
  }
  
  return null;
}

function drawPowerEffect(landmarks) {
  const jutsu = jutsuList[currentJutsu];
  const time = Date.now() / 100;
  
  // Draw effect at fingertips
  const fingertips = [4, 8, 12, 16, 20];
  
  fingertips.forEach((tipIndex, i) => {
    const tip = landmarks[tipIndex];
    const x = tip.x * canvasElement.width;
    const y = tip.y * canvasElement.height;
    
    if (currentJutsu === 'chidori') {
      drawChidori(x, y, time, i);
    } else if (currentJutsu === 'rasengan') {
      drawRasengan(x, y, time, i);
    } else if (currentJutsu === 'fireball') {
      drawFireball(x, y, time, i);
    } else if (currentJutsu === 'shadowclone') {
      drawShadowClone(x, y, time, i);
    } else if (currentJutsu === 'sharingan') {
      drawSharingan(x, y, time, i);
    } else if (currentJutsu === 'byakugan') {
      drawByakugan(x, y, time, i);
    } else if (currentJutsu === 'waterdragon') {
      drawWaterDragon(x, y, time, i);
    } else if (currentJutsu === 'substitution') {
      drawSubstitution(x, y, time, i);
    } else if (currentJutsu === 'transformation') {
      drawTransformation(x, y, time, i);
    } else if (currentJutsu === 'summoning') {
      drawSummoning(x, y, time, i);
    } else if (currentJutsu === 'earthwall') {
      drawEarthWall(x, y, time, i);
    } else if (currentJutsu === 'windscythe') {
      drawWindScythe(x, y, time, i);
    } else if (currentJutsu === 'lightningblade') {
      drawLightningBlade(x, y, time, i);
    } else if (currentJutsu === 'icemirrors') {
      drawIceMirrors(x, y, time, i);
    } else if (currentJutsu === 'sandcoffin') {
      drawSandCoffin(x, y, time, i);
    } else if (currentJutsu === 'eightgates') {
      drawEightGates(x, y, time, i);
    } else if (currentJutsu === 'particlestyle') {
      drawParticleStyle(x, y, time, i);
    } else if (currentJutsu === 'woodstyle') {
      drawWoodStyle(x, y, time, i);
    }
  });
}

function drawChidori(x, y, time, index) {
  const pulse = Math.sin(time + index) * 5 + 35;
  
  let gradient = canvasCtx.createRadialGradient(x, y, 5, x, y, pulse);
  gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
  gradient.addColorStop(0.3, 'rgba(0, 212, 255, 0.7)');
  gradient.addColorStop(1, 'transparent');
  
  canvasCtx.fillStyle = gradient;
  canvasCtx.beginPath();
  canvasCtx.arc(x, y, pulse, 0, 2 * Math.PI);
  canvasCtx.fill();
  
  canvasCtx.strokeStyle = `rgba(255, 255, 255, ${0.6 + Math.random() * 0.4})`;
  canvasCtx.lineWidth = 2;
  canvasCtx.shadowBlur = 8;
  canvasCtx.shadowColor = '#00d4ff';
  
  for(let i = 0; i < 5; i++) {
    const angle = (Math.PI * 2 * i) / 5 + time;
    const length = 30 + Math.random() * 20;
    const endX = x + Math.cos(angle) * length;
    const endY = y + Math.sin(angle) * length;
    
    canvasCtx.beginPath();
    canvasCtx.moveTo(x, y);
    const midX = (x + endX) / 2 + (Math.random() - 0.5) * 15;
    const midY = (y + endY) / 2 + (Math.random() - 0.5) * 15;
    canvasCtx.lineTo(midX, midY);
    canvasCtx.lineTo(endX, endY);
    canvasCtx.stroke();
  }
  canvasCtx.shadowBlur = 0;
}

function drawRasengan(x, y, time, index) {
  const radius = 30 + Math.sin(time + index) * 5;
  
  for(let i = 0; i < 3; i++) {
    const offset = (time * 2 + i * Math.PI * 2 / 3);
    canvasCtx.strokeStyle = `rgba(65, 105, 225, ${0.7 - i * 0.2})`;
    canvasCtx.lineWidth = 4 - i;
    canvasCtx.shadowBlur = 10;
    canvasCtx.shadowColor = '#4169E1';
    
    canvasCtx.beginPath();
    for(let a = 0; a < Math.PI * 4; a += 0.1) {
      const r = (a / (Math.PI * 4)) * radius;
      const px = x + Math.cos(a + offset) * r;
      const py = y + Math.sin(a + offset) * r;
      if(a === 0) canvasCtx.moveTo(px, py);
      else canvasCtx.lineTo(px, py);
    }
    canvasCtx.stroke();
  }
  canvasCtx.shadowBlur = 0;
}

function drawFireball(x, y, time, index) {
  const pulse = Math.sin(time * 2 + index) * 8 + 35;
  
  let gradient = canvasCtx.createRadialGradient(x, y, 5, x, y, pulse);
  gradient.addColorStop(0, 'rgba(255, 255, 200, 0.9)');
  gradient.addColorStop(0.3, 'rgba(255, 140, 0, 0.8)');
  gradient.addColorStop(0.6, 'rgba(255, 69, 0, 0.5)');
  gradient.addColorStop(1, 'transparent');

const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});
hands.onResults(onResults);

const camera = new Camera(videoElement, {
  onFrame: async () => {
    await hands.send({image: videoElement});
  },
  width: 1280,
  height: 720
});
camera.start();

resetSequence();
